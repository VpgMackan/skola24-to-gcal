[tool.poetry]
name = "skola24-to-gcal"
version = "0.1.0"
description = "A tool to fetch schedules from Skola24 and generate Google Calendar events."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.8"
requests = "^2.28.0"
PyYAML = "^6.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"